services:
  - type: web
    name: wasteless
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:render
    startCommand: NODE_ENV=production SERVE_FRONTEND=true pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false